name: Android release APK

# Push a tag like v0.1.0 (or run manually) to build a release APK and attach
# it to a GitHub Release.
#
# Optional repo settings (Settings > Secrets and variables > Actions):
#   variables: API_BASE_URL, WS_BASE_URL  (e.g. https://x.up.railway.app / wss://...)
#              MAP_PROVIDER               (osm = default, no key; google = needs MAPS_API_KEY)
#   secret:    MAPS_API_KEY               (Google Maps SDK for Android key)
#   secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#              (stable release signing; create with scripts/setup-release-signing.ps1)
# Without them the APK targets the Android emulator's host (10.0.2.2:8000)
# and the map renders blank.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}
      WS_BASE_URL: ${{ vars.WS_BASE_URL || 'ws://10.0.2.2:8000' }}
      MAP_PROVIDER: ${{ vars.MAP_PROVIDER || 'osm' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # current AGP lint needs Java 21 APIs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING=release key" >> "$GITHUB_ENV"

      - name: Join-link host (defaults to the API host)
        run: |
          host="${{ vars.JOIN_HOST }}"
          if [ -z "$host" ]; then host="${API_BASE_URL#*://}"; host="${host%%/*}"; host="${host%%:*}"; fi
          echo "JOIN_HOST=$host" >> "$GITHUB_ENV"

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name="${TAG#v}"
          --build-number="${{ github.run_number }}"
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=WS_BASE_URL="$WS_BASE_URL"
          --dart-define=MAP_PROVIDER="$MAP_PROVIDER"
          --dart-define=JOIN_HOST="$JOIN_HOST"
          --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Name artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "ridesync-$TAG.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ridesync-${{ env.TAG }}-apk
          path: mobile/ridesync-${{ env.TAG }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: RideSync ${{ env.TAG }}
          files: mobile/ridesync-${{ env.TAG }}.apk
          body: |
            Sideloadable Android APK built by CI from `${{ github.sha }}`.

            **Install:** download `ridesync-${{ env.TAG }}.apk` on the phone, allow
            "Install unknown apps" for your browser/file manager, open it.

            **Before relying on this build:**
            - Backend: `${{ env.API_BASE_URL }}`. If that is `10.0.2.2` it only
              works in the Android emulator; set the `API_BASE_URL` / `WS_BASE_URL`
              repo variables to your deployed backend (https/wss) and re-run.
            - Map: `${{ env.MAP_PROVIDER }}` (osm = OpenStreetMap data, no key needed;
              google needs the `MAPS_API_KEY` secret).
            - Signing: ${{ env.SIGNING || 'throwaway debug key (set the ANDROID_KEYSTORE_* secrets for a stable key)' }}.
            - Google Maps key: ${{ env.MAPS_API_KEY != '' && 'included' || 'not set' }}.
