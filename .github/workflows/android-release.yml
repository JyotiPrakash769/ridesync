name: Android release APK

# Push a tag like v0.1.0 (or run manually) to build a release APK and attach
# it to a GitHub Release.
#
# Optional repo settings (Settings > Secrets and variables > Actions):
#   variables: API_BASE_URL, WS_BASE_URL  (e.g. https://x.up.railway.app / wss://...)
#   secret:    MAPS_API_KEY               (Google Maps SDK for Android key)
# Without them the APK targets the Android emulator's host (10.0.2.2:8000)
# and the map renders blank.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}
      WS_BASE_URL: ${{ vars.WS_BASE_URL || 'ws://10.0.2.2:8000' }}
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --dart-define=WS_BASE_URL="$WS_BASE_URL"

      - name: Name artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "ridesync-$TAG.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ridesync-${{ env.TAG }}-apk
          path: mobile/ridesync-${{ env.TAG }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: RideSync ${{ env.TAG }}
          files: mobile/ridesync-${{ env.TAG }}.apk
          body: |
            Sideloadable Android APK built by CI from `${{ github.sha }}`.

            **Install:** download `ridesync-${{ env.TAG }}.apk` on the phone, allow
            "Install unknown apps" for your browser/file manager, open it.

            **Before relying on this build:**
            - Backend: `${{ env.API_BASE_URL }}`. If that is `10.0.2.2` it only
              works in the Android emulator; set the `API_BASE_URL` / `WS_BASE_URL`
              repo variables to your deployed backend (https/wss) and re-run.
            - The map needs a Google Maps key (`MAPS_API_KEY` repo secret);
              without it the map is blank, everything else works.
            - Signed with the debug key (testing only).
